services:
  postgres:
    image: postgres:16-alpine
    container_name: beam-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: beam_dev
      POSTGRES_PASSWORD: beam_dev_password
      POSTGRES_DB: beam_dev
    volumes:
      - beam_pgdata:/var/lib/postgresql/data
      - ./db/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beam_dev -d beam_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  beam_pgdata:
