name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beam_dev
          POSTGRES_PASSWORD: beam_dev_password
          POSTGRES_DB: beam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://beam_dev:beam_dev_password@localhost:5432/beam_test
      TEST_DATABASE_URL: postgresql://beam_dev:beam_dev_password@localhost:5432/beam_test
      SESSION_SECRET: ci-only-session-secret-placeholder-32bytes
      SESSION_TTL_DEFAULT_HOURS: "24"
      SESSION_TTL_REMEMBER_DAYS: "30"
      ALLOWED_EMAIL_DOMAIN: eiu.edu.vn
      CRON_SECRET: ci-only-cron-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run db:migrate -- --test
      - run: npm run db:seed -- --test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run arch:check
      - run: npm run openapi:check
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
